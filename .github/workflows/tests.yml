name: Tests Playwright

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7.0.1

      - name: Configurer Node.js LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium et WebKit (Playwright)
        run: npx playwright install --with-deps chromium webkit

      - name: Exécuter la suite Playwright (--repeat-each=2)
        run: npx playwright test --repeat-each=2
